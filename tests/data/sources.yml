# Provenance of every test sample. tools/build_samples.py rebuilds tests/data/ from this
# file and CI verifies that the committed samples match (job "Sample provenance").
#
# Windows: OTRF Security-Datasets (MIT licence), pinned to commit d9d40ef. Lab hosts from
# the "theshire.local" / "pandalab" environments recorded with Sysmon and Windows auditing.
# Linux: loghub OpenSSH_2k.log, a real SSH server exposed to the Internet (see NOTICE).
#
# Selector syntax: "Field: value", "Field|contains", "|startswith", "|endswith", "|re";
# a list means "any of"; "not:" excludes. "distinct" removes duplicates on the listed
# fields, "limit" caps the number of events.

