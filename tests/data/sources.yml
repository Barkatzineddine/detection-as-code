# Shortcuts reused below.
x-sysmon-proc: &proc {Channel: Microsoft-Windows-Sysmon/Operational, EventID: 1}

samples:
  # Real background activity recorded on the same lab hosts: Windows services, the Azure
  # guest agent and its extensions, search indexing, monitoring agents. Every rule is run
  # against it and must stay silent.
  _baseline:
    benign:
      - source: wmi_subscription
        where:
          <<: *proc
          ParentImage|re: '\\(waappagent|windowsazureguestagent|networkwatcheragent|customscripthandler|svchost|searchindexer|compattelrunner)\.exe$'
        distinct: [Image, ParentImage]
        limit: 25
      - source: run_keys
        where:
          <<: *proc
          ParentImage|re: '\\(waappagent|windowsazureguestagent|networkwatcheragent|svchost)\.exe$'
        distinct: [Image, ParentImage]
        limit: 15
      - source: schtask_remote
        where: {<<: *proc, ParentImage|endswith: [\MonitoringHost.exe, \SearchIndexer.exe, \Wireshark.exe]}
        distinct: [Image]
      - source: run_keys
        where:
          Channel: Microsoft-Windows-Sysmon/Operational
          EventID: 13
          not: {TargetObject|contains: \CurrentVersion\Run}
        distinct: [Image]
        limit: 20
      - source: ntdsutil_ifm
        where: {Channel: Microsoft-Windows-Sysmon/Operational, EventID: 10}
        distinct: [SourceImage, TargetImage]
        limit: 15
      - source: run_keys
        where: {Channel: security, EventID: [4688, 4697, 4703, 4673]}
        distinct: [EventID, NewProcessName, ServiceName, ProcessName]
        limit: 20

  proc_creation_win_powershell_encoded_cmd:
    attack:
      - source: launcher_vbs
        where: {<<: *proc, Image|endswith: \powershell.exe}
      - source: smbexec
        where: {<<: *proc, Image|endswith: \powershell.exe}
      - source: fodhelper
        where: {<<: *proc, Image|endswith: \powershell.exe}
    benign:
      # PowerShell remoting session host (no argument) and Azure agent tools whose
      # arguments start like the -e / -en abbreviations.
      - source: purplesharp
        where: {<<: *proc, Image|endswith: \powershell.exe}
        limit: 1
      - source: wmi_subscription
        where: {<<: *proc, Image|endswith: \AntimalwareConfig.exe}
      - source: run_keys
        where: {<<: *proc, Image|endswith: \ClipRenew.exe}
        limit: 1

  proc_access_win_lsass_suspicious_access:
    attack:
      - source: mimikatz_logonpasswords
        where:
          Channel: Microsoft-Windows-Sysmon/Operational
          EventID: 10
          TargetImage|endswith: \lsass.exe
          SourceImage|endswith: \powershell.exe
    benign:
      # Routine access to LSASS by the system: svchost (LSM, SysMain) and VirtualBox tools.
      - source: mimikatz_logonpasswords
        where: {EventID: 10, TargetImage|endswith: \lsass.exe, SourceImage|endswith: \svchost.exe}
        distinct: [GrantedAccess]
      - source: dcsync
        where: {EventID: 10, TargetImage|endswith: \lsass.exe}
        distinct: [GrantedAccess]
      - source: ntdsutil_ifm
        where: {EventID: 10, TargetImage|endswith: \lsass.exe, SourceImage|endswith: \VBoxService.exe}
        limit: 1

  proc_creation_win_rundll32_comsvcs_minidump:
    attack:
      - source: comsvcs_minidump
        where: {<<: *proc, Image|endswith: \rundll32.exe}
    benign:
      - source: ntdsutil_ifm
        where: {<<: *proc, Image|endswith: \rundll32.exe}

  proc_creation_win_reg_save_sensitive_hive:
    attack:
      - source: reg_dump_sam
        where: {<<: *proc, Image|endswith: \reg.exe}
    benign:
      # Service and event-log administration by the Azure guest agent.
      - source: wmi_subscription
        where: {<<: *proc, Image|endswith: [\sc.exe, \wevtutil.exe]}
        distinct: [CommandLine]
        limit: 3

  proc_creation_win_ntdsutil_ifm_dump:
    attack:
      - source: ntdsutil_ifm
        where: {<<: *proc, Image|endswith: \ntdsutil.exe}
    benign:
      # Volume Shadow Copy service activity on the same domain controller.
      - source: ntdsutil_ifm
        where: {<<: *proc, Image|endswith: [\VSSVC.exe, \svchost.exe]}
        distinct: [Image]

  win_security_dcsync_replication_request:
    attack:
      - source: dcsync
        where: {EventID: 4662, Properties|contains: 1131f6a}
    benign:
      # Same event ID: an LDAP read of the domain object's security descriptor (no
      # replication right) and a local service touching a non-directory object.
      - source: powerview_ldap
        where: {EventID: 4662}
        limit: 1
      - source: run_keys
        where: {EventID: 4662}
        limit: 1

  proc_creation_win_schtasks_create_suspicious:
    attack:
      - source: schtask_remote
        where: {<<: *proc, Image|endswith: \schtasks.exe}
      - source: schtasks_empire
        where: {<<: *proc, Image|endswith: \schtasks.exe}
    benign:
      # Script and command hosts started by monitoring and Azure agents.
      - source: schtask_remote
        where: {<<: *proc, Image|endswith: \cscript.exe}
        limit: 1
      - source: wmi_subscription
        where: {<<: *proc, Image|endswith: \cmd.exe, ParentImage|endswith: \WindowsAzureGuestAgent.exe}
        limit: 2

  registry_set_win_run_key_suspicious:
    attack:
      - source: run_keys
        where: {EventID: 13, TargetObject|contains: \CurrentVersion\Run\, Image|endswith: \powershell.exe}
    benign:
      # Windows Defender registering its tray icon under HKLM\...\Run.
      - source: run_keys
        where: {EventID: 13, TargetObject|contains: \CurrentVersion\Run\, Image|endswith: \MsMpEng.exe}

  win_security_service_install_suspicious:
    attack:
      - source: psexec
        where: {EventID: 4697}
      - source: smbexec
        where: {EventID: 4697}
    benign:
      # Per-user services Windows installs at every logon.
      - source: run_keys
        where: {EventID: 4697}
        distinct: [ServiceName]
        limit: 8

  win_security_audit_log_cleared:
    attack:
      - source: bitsadmin_download
        where: {EventID: 1102}
      - source: comsvcs_minidump
        where: {EventID: 1102}
    benign:
      - source: bitsadmin_download
        where: {Channel: Security, EventID: [4688, 4689, 4703, 4799]}
        distinct: [EventID]

  registry_set_win_eventlog_service_disabled:
    attack:
      - source: eventlog_service_disabled
        where: {EventID: 13, TargetObject|endswith: \Services\EventLog\Start}
    benign:
      # ETW autologger sessions for the event log, toggled by the system.
      - source: eventlog_service_disabled
        where: {EventID: 13, TargetObject|contains: \Autologger\EventLog-}
        limit: 4

  proc_creation_win_mshta_inline_script:
    attack:
      - source: mshta_vbscript
        where: {<<: *proc, Image|endswith: \mshta.exe}
    benign:
      - source: schtask_remote
        where: {<<: *proc, Image|endswith: \cscript.exe}
        limit: 1

  proc_creation_win_regsvr32_remote_scriptlet:
    attack:
      - source: regsvr32_sct
        where: {<<: *proc, Image|endswith: \regsvr32.exe}
    benign:
      - source: ntdsutil_ifm
        where: {<<: *proc, Image|endswith: \rundll32.exe}

  registry_set_win_uac_bypass_ms_settings:
    attack:
      - source: fodhelper
        where: {EventID: 13, TargetObject|contains: \ms-settings\Shell\Open\command}
    benign:
      # fodhelper.exe itself records that the ms-settings protocol was used.
      - source: fodhelper
        where: {EventID: 13, TargetObject|contains: ApplicationAssociationToasts}

  wmi_event_win_commandline_consumer:
    attack:
      - source: wmi_subscription
        where: {Channel: Microsoft-Windows-Sysmon/Operational, EventID: 20, Type: Command Line}
    benign:
      - source: wmi_subscription
        where: {<<: *proc, Image|endswith: \WmiPrvSE.exe}
        limit: 1

  proc_creation_win_netsh_firewall_allow_inbound:
    attack:
      - source: netsh_firewall
        where: {<<: *proc, Image|endswith: \netsh.exe, CommandLine|contains: ' add rule '}
    benign:
      # Network Watcher packet captures, and the removal of a firewall rule.
      - source: run_keys
        where: {<<: *proc, Image|endswith: \netsh.exe}
        distinct: [CommandLine]
        limit: 2
      - source: netsh_firewall
        where: {<<: *proc, Image|endswith: \netsh.exe, CommandLine|contains: ' delete rule '}

  proc_creation_win_auditpol_disable_logging:
    attack:
      - source: auditpol_modification
        where: {<<: *proc, Image|endswith: \auditpol.exe}
    benign:
      # Event-log manifest (un)registration by the Azure guest agent.
      - source: wmi_subscription
        where: {<<: *proc, Image|endswith: \wevtutil.exe}
        distinct: [CommandLine]
        limit: 2

  proc_creation_win_bitsadmin_download:
    attack:
      - source: bitsadmin_download
        where: {<<: *proc, Image|endswith: \bitsadmin.exe}
    benign:
      - source: bitsadmin_download
        where: {<<: *proc, Image|endswith: \svchost.exe}

  lnx_sshd_password_bruteforce:
    attack:
      - source: loghub_openssh
        where: {src_ip: 5.188.10.180}
    benign:
      # The one successful interactive login, and sources with only a couple of failures.
      - source: loghub_openssh
        where: {src_ip: [119.137.62.142, 173.234.31.186, 106.5.5.195, 202.100.179.208]}

  lnx_sshd_invalid_user_enumeration:
    attack:
      - source: loghub_openssh
        where: {src_ip: 103.99.0.122}
    benign:
      - source: loghub_openssh
        where: {src_ip: [119.137.62.142, 173.234.31.186, 106.5.5.195, 202.100.179.208]}
