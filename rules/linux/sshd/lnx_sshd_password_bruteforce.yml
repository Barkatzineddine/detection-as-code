title: SSH Failed Password
id: f1a1e5e0-36c2-41a3-8c89-3a864bedb8a1
name: sshd_failed_password
status: test
description: A failed password authentication logged by sshd. Building block of the brute-force correlation below; it does not alert on its own.
references:
  - https://man.openbsd.org/sshd.8
author: Mohamed Zineddine Barkat
date: 2026-10-22
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains: 'Failed password for '
  condition: selection
falsepositives:
  - Users mistyping their password.
level: informational
---
title: SSH Password Brute Force From a Single Source
id: 153fa3eb-0f31-422e-b199-0afbbaad09a7
status: test
description: |
  Detects 10 or more failed SSH password attempts from the same source address within five
  minutes. A person mistypes a password two or three times; a tool guessing passwords
  produces dozens of failures per minute.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Mohamed Zineddine Barkat
date: 2026-10-22
tags:
  - attack.credential-access
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - sshd_failed_password
  group-by:
    - src_ip
  timespan: 5m
  condition:
    gte: 10
falsepositives:
  - A misconfigured script or monitoring probe retrying with an expired password. It comes from a known internal address and always uses the same account.
level: medium
